name: Notify Bing with IndexNow

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Jekyll site to Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify ownership and notify Bing
        run: python3 _scripts/submit_indexnow.py --site https://stile.cc --key-file indexnow-key.txt
