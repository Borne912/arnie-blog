# 构建并部署到 GitHub Pages
# - push 到默认分支：构建 + 部署
# - pull_request（包括 Dependabot 的升级 PR）：只构建不部署，用来验证升级是否安全
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 正式部署按推送顺序依次执行、互不取消；PR 构建各自分组，新的推送会取消旧的构建
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # 固定系统版本，不跟随 ubuntu-latest 漂移
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      LANG: C.UTF-8 # 中文文件名需要 UTF-8 locale
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Ruby 版本取自 .ruby-version，gem 版本取自 Gemfile.lock
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Build search index (Pagefind)
        id: pagefind
        continue-on-error: true # 搜索索引出问题也不阻塞发布
        run: npx -y pagefind@1.5.2
      - name: Warn if search index failed
        if: steps.pagefind.outcome == 'failure'
        run: echo "::warning::Pagefind 索引生成失败，本次发布的 /search/ 暂不可用"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    # 只部署默认分支（分支改名后自动跟随）；PR 和其他分支只构建
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
