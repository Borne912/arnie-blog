# 构建并部署到 GitHub Pages
# - push 到默认分支：构建 + 部署
# - pull_request（包括 Dependabot 的升级 PR）：只构建不部署，用来验证升级是否安全
name: Deploy Jekyll site to Pages

on:
  push:
    # 同时列出 main 和 master，分支改名前后都能正常部署；改名完成后可删掉 master
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # 固定系统版本，不跟随 ubuntu-latest 漂移
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8 # 中文文件名需要 UTF-8 locale
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # Ruby 版本取自 .ruby-version，gem 版本取自 Gemfile.lock
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    # 只对部署排队，避免 PR 的构建取消正在排队的正式部署
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
