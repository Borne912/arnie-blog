# 放在 /etc/nginx/sites-available/stile-stats，再链接到 sites-enabled。
# 仅用于首次签发证书；不改动其他站点的 server 配置。
server {
    listen 80;
    server_name stats.stile.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stile-stats-acme;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
