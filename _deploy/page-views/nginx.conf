# Ubuntu 24.04 / Nginx 1.24；包含此文件的位置必须处于 http 上下文。
# 例如 /etc/nginx/sites-available/stile-stats -> sites-enabled/stile-stats。
# 若现有 443 在 stream 中用于 TLS/SNI 分流，必须先适配现有路由，不能直接加载本模板争用端口。
map $http_origin $stile_stats_origin_allowed {
    default 0;
    "" 1;
    "https://stile.cc" 1;
}

map $http_x_bsz_referer $stile_stats_referer_allowed {
    default 0;
    ~^https://stile[.]cc/[^?#]*$ 1;
}

upstream stile_page_views {
    server 127.0.0.1:18080;
    keepalive 8;
}

# 访问日志仅记录状态、耗时和字节数，不记录访客 IP 或文章地址。
log_format stile_stats '$time_iso8601 $request_method $status $request_time $upstream_response_time $request_length $bytes_sent';

server {
    listen 80;
    server_name stats.stile.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stile-stats-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://stats.stile.cc$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stats.stile.cc;

    ssl_certificate /etc/letsencrypt/live/stats.stile.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.stile.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/stile-stats.access.log stile_stats;
    error_log /var/log/nginx/stile-stats.error.log warn;
    client_max_body_size 1k;

    # 统一在入口设置，避免与上游产生重复的 CORS / 缓存响应头。
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Set-Bsz-Identity;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Access-Control-Allow-Origin "https://stile.cc" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "x-bsz-referer" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header Vary "Origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    # 不自动重发写入请求，避免响应丢失时重复计数。
    proxy_next_upstream off;
    proxy_cache off;

    location = /api {
        if ($stile_stats_origin_allowed = 0) { return 403; }
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
        # 预检请求没有 x-bsz-referer，必须先处理。
        if ($request_method = OPTIONS) { return 204; }
        if ($stile_stats_referer_allowed = 0) { return 400; }
        proxy_pass http://stile_page_views;
    }

    location = /ping {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://stile_page_views;
    }

    location / {
        return 404;
    }
}
