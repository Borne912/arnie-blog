{% if jekyll.environment == 'production' and site.page_views and site.page_views_api %}
<div class="site-views" data-site-views-url="{{ page.url | absolute_url | escape }}"{% if page.page_views != false %} data-site-views-increment{% endif %} style="display: none;" aria-live="polite">
    <i class="fas fa-eye" aria-hidden="true"></i>
    网站总访问量：<span data-site-views-value></span> 次
</div>
{% endif %}
