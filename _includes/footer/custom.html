<!-- start custom footer snippets -->
<!-- 配置网站知识共享许可协议 -->
<div class="license-container">
    <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh">
        <img class="license-icon" alt="CC 许可协议" src="/assets/images/by-nc-sa.png">
    </a>
    <p>
        本站内容采用
        <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh">
            CC BY-NC-SA 4.0 许可协议
        </a>，除非另有声明。
    </p>
</div>

{% if jekyll.environment == 'production' and site.page_views and site.page_views_api %}
<div class="site-views" data-site-views-url="{{ page.url | absolute_url | escape }}"{% if page.page_views != false %} data-site-views-increment{% endif %} style="display: none;" aria-live="polite">
    <i class="fas fa-eye" aria-hidden="true"></i>
    网站总访问量：<span data-site-views-value></span> 次
</div>
{% endif %}

{% if site.site_launched_at %}
<div class="site-runtime" data-site-runtime data-launched-at="{{ site.site_launched_at | date_to_xmlschema }}">
    <p>网站上线时间：<time datetime="{{ site.site_launched_at | date_to_xmlschema }}">{{ site.site_launched_at | date: '%Y-%m-%d %H:%M' }}</time>（北京时间）</p>
    <p data-site-runtime-row hidden>已运行：<span data-site-runtime-value role="timer" aria-live="off"></span></p>
</div>
{% endif %}

<!-- end custom footer snippets -->
