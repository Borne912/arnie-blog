<!-- start custom head snippets -->

<!-- 设置网站 favicons 图标（https://realfavicongenerator.net/） -->
<link rel="icon" type="image/png" href="/assets/favicons/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
<link rel="shortcut icon" href="/assets/favicons/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="STiLE" />
<link rel="manifest" href="/assets/favicons/site.webmanifest" />

<!-- 明/暗模式：跟随系统设置。本站自带暗色样式，告诉 Dark Reader 等插件不要再改色 -->
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<link rel="stylesheet" href="{{ '/assets/css/main-dark.css' | relative_url }}" media="(prefers-color-scheme: dark)">

<!-- 数学公式：只在含公式的页面加载；脚本放在本站，不依赖境外 CDN
     Ref: https://docs.mathjax.org/en/latest/options/input/tex.html -->
{% if page.content contains '\(' or page.content contains '\[' %}
<script>
    MathJax = {
        tex: {
            processEscapes: true,      // use \$ to produce a literal dollar sign
            processEnvironments: true  // process \begin{xxx}...\end{xxx} outside math mode
        },
        svg: { fontCache: 'global' }
    };
</script>
<script id="MathJax-script" async src="{{ '/assets/vendor/mathjax/tex-svg-full.js' | relative_url }}"></script>
{% endif %}
<!-- end custom head snippets -->
