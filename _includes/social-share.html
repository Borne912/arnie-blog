<section class="page__share">
  {% if site.data.ui-text[site.locale].share_on_label %}
  <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>
  {% endif %}

  <a href="{{ '/assets/images/wechat-qr.png' | relative_url }}" class="btn btn--wechat" target="_blank" rel="noopener"
    title="{{ site.data.ui-text[site.locale].follow_label | default: '关注' }} 公众号【纸浅】">
    <i class="fab fa-fw fa-weixin" aria-hidden="true"></i><span> 公众号</span>
  </a>

  <a href="https://x.com/intent/tweet?{% if site.twitter.username %}via={{ site.twitter.username | url_encode }}&{% endif %}text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}"
    class="btn btn--x" target="_blank" rel="noopener"
    title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} X"><i
      class="fab fa-fw fa-x-twitter" aria-hidden="true"></i><span> X</span></a>

  <a href="{{ '/assets/images/coffee-qr.png' | relative_url }}" class="btn btn--coffee" target="_blank" rel="noopener"
    title="请作者喝杯咖啡">
    <i class="fa-solid fa-fw fa-mug-hot" aria-hidden="true"></i><span> Buy me a coffee</span>
  </a>
</section>
